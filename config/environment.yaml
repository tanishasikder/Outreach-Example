name: outreach-example
channels:
  - conda-forge
dependencies:
  - python=3.13  # same as .venv and the Dockerfile
  - pip
  - pip:
    - -r ../requirements.txt  # app dependencies, pinned in one place
    - mlflow    # experiment tracking (old pins 2.11 / 0.3.25 don't support Python 3.13)
    - dagshub
