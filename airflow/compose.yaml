# Airflow for the data pipeline (dags/deal_pipeline.py, dags/rag_ingest.py).
# Based on the official Airflow 3 compose file, trimmed for one machine:
# LocalExecutor (no Celery/Redis for Airflow), no triggerer.
#
# Run from the project root:
#   docker compose --env-file .env -f airflow/compose.yaml up -d --build
# UI: http://localhost:8080  (user "airflow", password AIRFLOW_ADMIN_PASSWORD or "airflow")
#
# Settings below like ${AIRFLOW_JWT_SECRET:-...} are read from the --env-file.
# The defaults are for local use only; on AWS they come from SSM (deploy/fetch_env.sh).

name: outreach-airflow

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  image: outreach-airflow
  env_file:
    - path: ../.env # S3_BUCKET, DBT_TARGET, QDRANT_* ... for the pipeline tasks
      required: false
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_FOLDER: /opt/app/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false' # Start running on schedule as soon as deployed
    AIRFLOW__CORE__PARALLELISM: '4'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-dev-only-jwt-secret}
    AIRFLOW__API__WORKERS: '1' # The UI is used by one person; saves memory
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Pipeline settings. The repo is mounted read-only, so everything the pipeline
    # writes goes to the warehouse volume, /tmp, or storage (S3 / artifacts/)
    DUCKDB_PATH: /opt/airflow/warehouse/warehouse.duckdb
    DBT_TARGET_PATH: /tmp/dbt/target
    DBT_LOG_PATH: /tmp/dbt/logs
    DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    PYTHONDONTWRITEBYTECODE: '1'
    PYTHONUNBUFFERED: '1'
  volumes:
    - ..:/opt/app:ro                       # Code, dbt project and data/ (read-only)
    - ../artifacts:/opt/app/artifacts      # Models when S3_BUCKET is not set (local runs)
    - airflow-logs:/opt/airflow/logs
    - warehouse:/opt/airflow/warehouse
  user: "50000:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080" # Only reachable from this machine. On AWS, open it with an SSM tunnel
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler # With LocalExecutor, tasks also run inside this container
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/warehouse
        chown -R 50000:0 /opt/airflow/logs /opt/airflow/warehouse
        /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
    user: "0:0"
    restart: "no"

volumes:
  postgres-db-volume:
  airflow-logs:
  warehouse:
